[project]
name = "agy-api-gateway"
version = "0.4.0"
description = "API gateway exposing OpenAI/Gemini/Anthropic-compatible endpoints backed by Google Antigravity CLI (agy)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
agy-gateway = "agy_gateway.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agy_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
